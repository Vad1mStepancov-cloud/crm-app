<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM - Управление заявками</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="authScreen" class="auth-screen">
  <h2>🔐 CRM Вход</h2>
  <div class="auth-tabs">
    <button id="tabLogin" class="active" onclick="switchAuth('login')">Вход</button>
    <button id="tabRegister" onclick="switchAuth('register')">Регистрация</button>
  </div>
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div style="margin-bottom:12px;"><label>Логин</label><input type="text" id="loginUser" required></div>
    <div style="margin-bottom:16px;"><label>Пароль</label><input type="password" id="loginPass" required></div>
    <button type="submit" class="btn-primary" style="width:100%;">Войти</button>
    <p style="margin-top:14px; font-size:12px; color:#888; text-align:center;">Первый вход: <b>admin / admin</b></p>
  </form>
  <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
    <div style="margin-bottom:12px;"><label>Логин</label><input type="text" id="regUser" required minlength="3"></div>
    <div style="margin-bottom:12px;"><label>Пароль (мин. 4 символа)</label><input type="password" id="regPass" required minlength="4"></div>
    <div style="margin-bottom:16px;"><label>Роль</label><select id="regRole"><option value="user">Пользователь</option><option value="admin">Администратор</option></select></div>
    <button type="submit" class="btn-primary" style="width:100%;">Зарегистрироваться</button>
  </form>
</div>

<div id="app" class="container" style="display:none;">
  <div class="header">
    <h1>📋 CRM - Управление заявками</h1>
    <div class="user-badge no-print">
      <div>👤 <span id="currentUserName">—</span></div>
      <button class="btn-secondary" style="padding:6px 12px; font-size:12px;" onclick="logout()">Выйти</button>
    </div>
  </div>
  <div class="summary">
    <div class="stat"><div class="stat-label">Всего заявок</div><div class="stat-value" id="statCount">0</div></div>
    <div class="stat"><div class="stat-label">Общая сумма</div><div class="stat-value" id="statTotal">0 ₽</div></div>
    <div class="stat"><div class="stat-label">Общий расход</div><div class="stat-value" id="statExpense">0 ₽</div></div>
    <div class="stat"><div class="stat-label">Прибыль</div><div class="stat-value" id="statProfit">0 ₽</div></div>
  </div>
  <div class="actions-bar no-print">
    <button class="btn-primary" onclick="openCreateModal()">+ Новая заявка</button>
    <button class="btn-secondary" onclick="exportCSV()">📤 Экспорт CSV</button>
    <button class="btn-secondary" onclick="exportJSON()">💾 Экспорт JSON</button>
    <button class="btn-secondary" onclick="window.print()">🖨️ Печать списка</button>
    <label class="btn-secondary" style="cursor:pointer; display:inline-flex; align-items:center;">📥 Импорт JSON<input type="file" accept=".json" style="display:none;" onchange="importJSON(event)"></label>
  </div>
  <div class="filters no-print">
    <div><label>🔍 Поиск</label><input type="text" id="searchInput" placeholder="Имя, телефон, адрес..." oninput="render()"></div>
    <div><label>Статус</label><select id="filterStatus" onchange="render()"><option value="">Все</option><option>Новая</option><option>В работе</option><option>Выполнена</option><option>Отменена</option></select></div>
    <div><label>Дата от</label><input type="date" id="filterDateFrom" onchange="render()"></div>
    <div><label>Дата до</label><input type="date" id="filterDateTo" onchange="render()"></div>
    <div><label>Сортировка</label><select id="sortSelect" onchange="render()"><option value="datetime-desc">Дата ↓</option><option value="datetime-asc">Дата ↑</option><option value="totalAmount-desc">Сумма ↓</option><option value="totalAmount-asc">Сумма ↑</option><option value="clientName-asc">Имя A-Z</option><option value="clientName-desc">Имя Z-A</option></select></div>
    <div><button class="btn-secondary" style="width:100%;" onclick="resetFilters()">Сбросить</button></div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('datetime')">Дата</th>
          <th onclick="sortBy('clientName')">Клиент</th>
          <th onclick="sortBy('clientPhone')">Телефон</th>
          <th onclick="sortBy('address')">Адрес</th>
          <th onclick="sortBy('status')">Статус</th>
          <th onclick="sortBy('totalAmount')">Сумма</th>
          <th onclick="sortBy('expense')">Расход</th>
          <th onclick="sortBy('toGive')">К сдаче</th>
          <th class="no-print">Действия</th>
        </tr>
      </thead>
      <tbody id="ordersTable"></tbody>
    </table>
  </div>
  <div class="empty" id="emptyMsg" style="display:none;">Заявок пока нет</div>
</div>

<div class="modal-bg no-print" id="orderModal">
  <div class="modal">
    <h3 id="modalTitle">Новая заявка</h3>
    <form id="orderForm" onsubmit="saveOrder(event)">
      <input type="hidden" id="editId">
      <div style="display:grid; gap:12px;">
        <div><label>Имя клиента</label><input type="text" id="clientName" required></div>
        <div><label>Телефон</label><input type="tel" id="clientPhone" required></div>
        <div><label>Адрес</label><input type="text" id="address" required></div>
        <div><label>Дата и время</label><input type="datetime-local" id="datetime" required></div>
        <div><label>Статус</label><select id="status"><option>Новая</option><option>В работе</option><option>Выполнена</option><option>Отменена</option></select></div>
        <div><label>Общая сумма (₽)</label><input type="number" id="totalAmount" step="0.01" min="0" required></div>
        <div><label>Расход (₽)</label><input type="number" id="expense" step="0.01" min="0" value="0" required></div>
        <div><label>К сдаче (₽)</label><input type="number" id="toGive" step="0.01" readonly style="background:#f3f4f6;"></div>
      </div>
      <div style="display:flex; gap:8px; margin-top:20px;">
        <button type="submit" class="btn-primary" style="flex:1;">Сохранить</button>
        <button type="button" class="btn-secondary" onclick="closeModal()">Отмена</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-bg no-print" id="printModal"><div class="modal" id="printContent"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
